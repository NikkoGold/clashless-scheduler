# Phrase -> expected parse, parsed against tests/data/phrase_catalog.json.
# `rules:` is checked exactly by tests/test_rule_parser.py (constraints unordered, unparsed in order).
# `llm:` (optional) feeds the live LLM eval; unparsed is ignored there.
# Constraint defaults apply when omitted: strength hard, weight 5 (compact defaults to soft).
# unparsed entries: {text: <original fragment>, reason: <code>, candidates: [...] (optional, default [])}

# ---- times: no_class_before / no_class_after ----
- text: "no classes before 10"
  rules: {constraints: [{kind: no_class_before, time: "10:00"}], unparsed: []}
  llm: {constraints: [{kind: no_class_before, time: "10:00"}]}
  tags: [time]
- text: "nothing before 9am"
  rules: {constraints: [{kind: no_class_before, time: "09:00"}], unparsed: []}
  tags: [time]
- text: "no class before 10:30"
  rules: {constraints: [{kind: no_class_before, time: "10:30"}], unparsed: []}
  tags: [time]
- text: "never before 8"
  rules: {constraints: [{kind: no_class_before, time: "08:00"}], unparsed: []}
  tags: [time, strength]
- text: "start after 11"
  rules: {constraints: [{kind: no_class_before, time: "11:00"}], unparsed: []}
  tags: [time]
- text: "no classes after 4pm"
  rules: {constraints: [{kind: no_class_after, time: "16:00"}], unparsed: []}
  tags: [time]
- text: "nothing after 16:00"
  rules: {constraints: [{kind: no_class_after, time: "16:00"}], unparsed: []}
  tags: [time]
- text: "no classes after 4"
  rules: {constraints: [{kind: no_class_after, time: "16:00"}], unparsed: []}
  tags: [time]
- text: "finish by 6"
  rules: {constraints: [{kind: no_class_after, time: "18:00"}], unparsed: []}
  tags: [time]
- text: "no classes after noon"
  rules: {constraints: [{kind: no_class_after, time: "12:00"}], unparsed: []}
  tags: [time]
- text: "no classes after 12"
  rules: {constraints: [{kind: no_class_after, time: "12:00"}], unparsed: []}
  tags: [time]
- text: "no classes after 8"  # a bare 8-12 is taken as given; the chip shows 08:00
  rules: {constraints: [{kind: no_class_after, time: "08:00"}], unparsed: []}
  tags: [time]
- text: "no classes after 4.30pm"  # a '.' between digits doesn't split
  rules: {constraints: [{kind: no_class_after, time: "16:30"}], unparsed: []}
  tags: [time, splitting]
- text: "no classes before 25"
  rules: {constraints: [], unparsed: [{text: "no classes before 25", reason: invalid_time}]}
  tags: [time]

# ---- days ----
- text: "fridays off"
  rules: {constraints: [{kind: day_off, day: Fri}], unparsed: []}
  llm: {constraints: [{kind: day_off, day: Fri}]}
  tags: [days]
- text: "Fri off"
  rules: {constraints: [{kind: day_off, day: Fri}], unparsed: []}
  tags: [days]
- text: "no classes on sunday"
  rules: {constraints: [{kind: day_off, day: Sun}], unparsed: []}
  tags: [days]
- text: "keep Thursdays free"
  rules: {constraints: [{kind: day_off, day: Thu}], unparsed: []}
  tags: [days]
- text: "Mon and Wed off"
  rules: {constraints: [{kind: day_off, day: Mon}, {kind: day_off, day: Wed}], unparsed: []}
  tags: [days, splitting]
- text: "Mon, Wed and Fri off"
  rules: {constraints: [{kind: day_off, day: Mon}, {kind: day_off, day: Wed}, {kind: day_off, day: Fri}], unparsed: []}
  tags: [days, splitting]
- text: "saturdays off"  # outside the default week: kept, and the solver gives it no effect
  rules: {constraints: [{kind: day_off, day: Sat}], unparsed: []}
  tags: [days]
- text: "weekends off"  # the weekend is Fri-Sat
  rules: {constraints: [{kind: day_off, day: Fri}, {kind: day_off, day: Sat}], unparsed: []}
  tags: [days]
- text: "no classes before 10 on Mondays"
  rules: {constraints: [{kind: no_class_before, time: "10:00", days: [Mon]}], unparsed: []}
  tags: [days, time]
- text: "no classes before 10 on Mon and Wed"
  rules: {constraints: [{kind: no_class_before, time: "10:00", days: [Mon, Wed]}], unparsed: []}
  tags: [days, time, splitting]
- text: "no classes before 10 except Tuesdays"
  rules: {constraints: [{kind: no_class_before, time: "10:00", days: [Sun, Mon, Wed, Thu, Fri]}], unparsed: []}
  tags: [days, time]
- text: "no lectures before 9 except on Sundays"
  rules: {constraints: [{kind: no_class_before, time: "09:00", days: [Mon, Tue, Wed, Thu, Fri]}], unparsed: []}
  tags: [days, time]
- text: "no classes before 10 on mondays and fridays off"  # two rules joined by a day list: not split, so not guessed
  rules: {constraints: [], unparsed: [{text: "no classes before 10 on mondays and fridays off", reason: not_understood}]}
  tags: [days, splitting, no-guessing]
- text: "no classes after 4 every day"
  rules: {constraints: [{kind: no_class_after, time: "16:00"}], unparsed: []}
  tags: [days, time]
- text: "no classes before 9 on weekdays"  # weekdays = the week minus Fri and Sat
  rules: {constraints: [{kind: no_class_before, time: "09:00", days: [Sun, Mon, Tue, Wed, Thu]}], unparsed: []}
  tags: [days, time]
- text: "no classes before 10 on weekends"
  rules: {constraints: [{kind: no_class_before, time: "10:00", days: [Fri, Sat]}], unparsed: []}
  tags: [days, time]
- text: "a day off"
  rules: {constraints: [], unparsed: [{text: "a day off", reason: not_understood}]}
  tags: [days, vague]
- text: "mornings off"
  rules: {constraints: [], unparsed: [{text: "mornings off", reason: not_understood}]}
  tags: [days, vague]
- text: "evenings free"
  rules: {constraints: [], unparsed: [{text: "evenings free", reason: not_understood}]}
  tags: [days, vague]

